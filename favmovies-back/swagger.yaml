      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - slug
              properties:
                title:
                  type: string
                  example: "Inception"
                  description: Movie title

                originalTitle:
                  type: string
                  nullable: true
                  example: "Inception"

                slug:
                  type: string
                  example: "inception"

                description:
                  type: string
                  nullable: true
                  example: "A thief who steals corporate secrets through dream-sharing technology."

                poster:
                  type: string
                  nullable: true
                  example: "66f3a1b2c3d4e5f678901235"
                  description: File ID

                backdrop:
                  type: string
                  nullable: true
                  example: "66f3a1b2c3d4e5f678901236"
                  description: File ID

                trailer:
                  type: string
                  nullable: true
                  example: "https://www.youtube.com/watch?v=YoHD9XEInc0"

                releaseDate:
                  type: string
                  format: date
                  nullable: true
                  example: "2010-07-16"

                duration:
                  type: number
                  example: 148
                  description: Duration in minutes

                ageRating:
                  type: string
                  nullable: true
                  example: "PG-13"

                genres:
                  type: array
                  items:
                    type: string
                  example:
                    - "66f3a1b2c3d4e5f678901234"

                director:
                  type: string
                  nullable: true
                  example: "66f3a1b2c3d4e5f678901238"

                writers:
                  type: array
                  items:
                    type: string
                  example:
                    - "66f3a1b2c3d4e5f678901239"

                actors:
                  type: array
                  items:
                    type: string
                  example:
                    - "66f3a1b2c3d4e5f678901240"

                countries:
                  type: array
                  items:
                    type: string
                  example:
                    - "United States"

                languages:
                  type: array
                  items:
                    type: string
                  example:
                    - "English"

                budget:
                  type: number
                  nullable: true
                  minimum: 0
                  example: 160000000

                revenue:
                  type: number
                  nullable: true
                  minimum: 0
                  example: 839000000

                status:
                  type: string
                  enum:
                    - upcoming
                    - released
                    - ended
                  example: "released"


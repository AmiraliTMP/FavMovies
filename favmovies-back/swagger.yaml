openapi: "3.0.0"

info:
  title: "Node Js API Project for mongodb"
  version: "1.0.0"
  description: "API documentation using Swagger"

components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"

  schemas:
    Genre:
      type: object
      properties:
        _id:
          type: string
          example: "66f3a1b2c3d4e5f678901234"

        name:
          type: string
          example: "Action"

        slug:
          type: string
          example: "action"

        image:
          type: string
          example: "66f3a1b2c3d4e5f678901235"

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    Movie:
      type: object
      properties:
        _id:
          type: string
          example: "66f3a1b2c3d4e5f678901236"

        title:
          type: string
          example: "Inception"

        originalTitle:
          type: string
          nullable: true
          example: "Inception"

        slug:
          type: string
          example: "inception"

        description:
          type: string
          nullable: true
          example: "A skilled thief who steals secrets through dream-sharing technology is given a chance to erase his past."

        poster:
          type: string
          nullable: true
          example: "66f3a1b2c3d4e5f678901237"

        backdrop:
          type: string
          nullable: true
          example: "66f3a1b2c3d4e5f678901238"

        trailer:
          type: string
          nullable: true
          example: "https://www.youtube.com/watch?v=YoHD9XEInc0"

        releaseDate:
          type: string
          format: date
          nullable: true
          example: "2010-07-16"

        duration:
          type: number
          nullable: true
          example: 148

        ageRating:
          type: string
          nullable: true
          example: "PG-13"

        rating:
          type: number
          minimum: 0
          maximum: 10
          example: 8.8

        voteCount:
          type: number
          minimum: 0
          example: 2500000

        genres:
          type: array
          items:
            type: string
          example:
            - "66f3a1b2c3d4e5f678901234"
            - "66f3a1b2c3d4e5f678901239"

        director:
          type: string
          nullable: true
          example: "66f3a1b2c3d4e5f678901240"

        writers:
          type: array
          items:
            type: string
          example:
            - "66f3a1b2c3d4e5f678901241"
            - "66f3a1b2c3d4e5f678901242"

        actors:
          type: array
          items:
            type: string
          example:
            - "66f3a1b2c3d4e5f678901243"
            - "66f3a1b2c3d4e5f678901244"

        countries:
          type: array
          items:
            type: string
          example:
            - "United States"
            - "United Kingdom"

        languages:
          type: array
          items:
            type: string
          example:
            - "English"

        budget:
          type: number
          minimum: 0
          nullable: true
          example: 160000000

        revenue:
          type: number
          minimum: 0
          nullable: true
          example: 839000000

        status:
          type: string
          enum:
            - upcoming
            - released
            - ended
          example: "released"

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

security:
  - bearerAuth: []

servers:
  - url: "http://localhost:3008"
  - url: "https://barsara.maksiran.ir"

# apis:

#    - routes: ["./src/routes/**/*.js"]

paths:
  /api/file/v1/upload:
    post:
      summary: Upload a file
      description: Upload a file to the server with details such as name, encoding, mimetype, and size.
      tags:
        - File
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
                type:
                  type: string
                  description: (Optional) Type of the file being uploaded.
      responses:
        200:
          description: File uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      fieldName:
                        type: string
                      originalName:
                        type: string
                      encoding:
                        type: string
                      mimetype:
                        type: string
                      destination:
                        type: string
                      fileName:
                        type: string
                      path:
                        type: string
                      size:
                        type: integer
                  message:
                    type: string
        400:
          description: Bad Request - Invalid file or file size exceeds 6MB.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/file/v1/upload-admin:
    post:
      summary: Upload a file as an admin
      description: Upload a file to the server with details such as name, encoding, mimetype, and size.
      tags:
        - File
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
                type:
                  type: string
                  description: (Optional) Type of the file being uploaded.
      responses:
        200:
          description: File uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      fieldName:
                        type: string
                      originalName:
                        type: string
                      encoding:
                        type: string
                      mimetype:
                        type: string
                      destination:
                        type: string
                      fileName:
                        type: string
                      path:
                        type: string
                      size:
                        type: integer
                  message:
                    type: string
        400:
          description: Bad Request - Invalid file or file size exceeds 6MB.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /{file_path}:
    get:
      summary: Download a file
      description: Retrieve a file from the server using its file path.
      tags:
        - File
      parameters:
        - name: file_path
          in: path
          required: true
          schema:
            type: string
          description: The path of the file to download.
      responses:
        200:
          description: File retrieved successfully.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          description: Bad Request - Invalid file path.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        404:
          description: Not Found - File does not exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/admin/v1/register-admin:
    post:
      summary: Register a new admin
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
                - password
                - permissions
                - mobile
              properties:
                firstName:
                  type: string
                  example: Ali
                  description: Admin's first name
                lastName:
                  type: string
                  example: Ahmadi
                  description: Admin's last name
                userName:
                  type: string
                  example: Ali_Ahmad20
                  description: Admin's username
                password:
                  type: string
                  example: "1234@ahmadi"
                  description: Admin's password
                permissions:
                  type: string
                  example: "fullaccess"
                  description: Admin's permissions
                mobile:
                  type: string
                  example: "09123456789"
                  description: Admin's mobile number
      responses:
        "200":
          description: Admin successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Admin creation was successful."
                  data:
                    type: object
                    properties:
                      firstName:
                        type: string
                        example: Ali
                      lastName:
                        type: string
                        example: Ahmadi
                      userName:
                        type: string
                        example: Ali_Ahmad20
                      mobile:
                        type: string
                        example: "09123456789"
                      permissions:
                        type: string
                        example: fullaccess

  /api/admin/v1/login:
    post:
      summary: Admin login with username and password
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  type: string
                  description: Admin's userName
                  example: Ali_Ahmad20
                password:
                  type: string
                  description: Admin's password
                  example: "1234@ahmadi"
      responses:
        "200":
          description: Admin logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token for authenticated requests
        "401":
          description: Unauthorized - Invalid credentials
        "400":
          description: Bad request - Missing fields

  /api/admin/v1/get-admin-profile-by-admin/{adminId}:
    get:
      summary: Get admin by ID
      tags:
        - Admin
      parameters:
        - in: path
          name: adminId
          required: true
          description: Admin's ID to retrieve
          schema:
            type: string

      responses:
        "200":
          description: Admin retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  firstName:
                    type: string
                    example: Ali
                    description: Admin's firstName
                  lastName:
                    type: string
                    example: Ahmadi
                    description: Admin's lastName
                  userName:
                    type: string
                    example: Ali_Ahmad20
                    description: Admin's userName
                  password:
                    type: string
                    example: "1234@ahmadi"
                    description: Admin's password
        "404":
          description: Admin not found
        "401":
          description: Unauthorized - Authentication required
  /api/admin/v1/get-user-profile-by-admin/{userId}:
    get:
      summary: Get user by ID
      tags:
        - Admin
      parameters:
        - in: path
          name: userId
          required: true
          description: user's ID to retrieve
          schema:
            type: string

      responses:
        "200":
          description: user retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  firstName:
                    type: string
                    example: Ali
                    description: Admin's firstName
                  lastName:
                    type: string
                    example: Ahmadi
                    description: Admin's lastName
                  userName:
                    type: string
                    example: Ali_Ahmad20
                    description: Admin's userName
                  password:
                    type: string
                    example: "1234@ahmadi"
                    description: Admin's password
        "404":
          description: user not found
        "401":
          description: Unauthorized - Authentication required

  /api/admin/v1/edit-admin-profile-by-admin:
    put:
      summary: put a admin
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
              properties:
                adminId:
                  type: string
                  example: "675683f91f5418245db3502c"
                  description: Admin's Id
                firstName:
                  type: string
                  example: Ali
                  description: admin's firstName
                lastName:
                  type: string
                  example: Ahmadi
                  description: Admin's lastName
                userName:
                  type: string
                  example: Ali_Ahmad20
                  description: Admin's userName
                password:
                  type: string
                  example: "1234@ahmadi"
                  description: Admin's password
                permissions:
                  type: string
                  example: "fullaccess"
                  description: Admin's permissions
      responses:
        "200":
          description: Admin successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  firstName:
                    type: string
                    example: Ali
                    description: Admin's firstName
                  lastName:
                    type: string
                    example: Ahmadi
                    description: Admin's lastName
                  userName:
                    type: string
                    example: Ali_Ahmad20
                    description: Admin's userName
                  password:
                    type: string
                    example: "1234@ahmadi"
                    description: Admin's password
        "404":
          description: Admin not found
        "401":
          description: Unauthorized - Authentication required

  /api/admin/v1/edit-my-profile:
    put:
      summary: put a admin by admin
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
              properties:
                firstName:
                  type: string
                  example: Ali
                  description: Admin's firstName
                lastName:
                  type: string
                  example: Ahmadi
                  description: Admin's lastName
                userName:
                  type: string
                  example: Ali_Ahmad20
                  description: Admin's userName
                password:
                  type: string
                  example: "1234@ahmadi"
                  description: Admin's password
      responses:
        "200":
          description: Admin successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  firstName:
                    type: string
                    example: Ali
                    description: Admin's firstName
                  lastName:
                    type: string
                    example: Ahmadi
                    description: Admin's lastName
                  userName:
                    type: string
                    example: Ali_Ahmad20
                    description: Admin's userName
                  password:
                    type: string
                    example: "1234@ahmadi"
                    description: Admin's password
        "404":
          description: Admin not found
        "401":
          description: Unauthorized - Authentication required

  /api/admin/v1/delete-my-profile:
    delete:
      summary: delete my profile
      tags:
        - Admin

      responses:
        "200":
          description: Admin successfully deleted
        "404":
          description: Admin not found
        "401":
          description: Unauthorized - Authentication required

  /api/admin/v1/delete-by-admin/{adminId}:
    delete:
      summary: Delete a admin
      tags:
        - Admin

      parameters:
        - in: path
          name: adminId
          description: Admin's ID to delete
          schema:
            type: string
      responses:
        "200":
          description: Admin successfully deleted
        "404":
          description: Admin not found
        "401":
          description: Unauthorized - Authentication required

  /api/admin/v1/get-admin-list:
    get:
      tags:
        - Admin
      summary: Get all admins
      description: Returns a paginated or full list of all active (non-deleted) admins. Supports optional search query.
      parameters:
        - name: limit
          in: query
          description: Maximum number of results per page (only if pagination is true)
          required: false
          schema:
            type: integer
            example: 20
        - name: page
          in: query
          description: Page number for paginated results
          required: false
          schema:
            type: integer
            example: 1
        - name: search
          in: query
          description: Search by admin username (case-insensitive partial match)
          required: false
          schema:
            type: string
            example: mohsen
        - name: pagination
          in: query
          description: Whether to paginate the response (`true` or `false`)
          required: false
          schema:
            type: string
            example: "true"
      responses:
        "200":
          description: List of admins retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "The list of admins was successfully found."
                  data:
                    type: object
                    properties:
                      docs:
                        type: array
                        items:
                          type: object
                          properties:
                            adminId:
                              type: string
                              example: "675683f91f5418245db3502c"
                            firstName:
                              type: string
                              example: "mohsen"
                            lastName:
                              type: string
                              example: "akbari"
                            userName:
                              type: string
                              example: "mohsen_akbari60"
                      totalDocs:
                        type: integer
                        example: 120
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
        "401":
          description: Unauthorized - Authentication required
        "500":
          description: Internal server error

  /api/admin/v1/get-my-profile:
    get:
      summary: Get admin by token
      tags:
        - Admin
      responses:
        "200":
          description: Admin found based on token
          content:
            application/json:
              schema:
                type: object
                properties:
                  firstName:
                    type: string
                    example: Ali
                    description: Admin's firstName
                  lastName:
                    type: string
                    example: Ahmadi
                    description: Admin's lastName
                  userName:
                    type: string
                    example: Ali_Ahmad20
                    description: Admin's userName
                  password:
                    type: string
                    example: "1234@ahmadi"
                    description: Admin's password
        "401":
          description: Unauthorized - Authentication required

  /api/user/v1/send-otp:
    post:
      summary: Send activation code for user
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                  example: "9121111111"
                  description: Mobile number to send activation code
      responses:
        "200":
          description: Activation code sent successfully

        "400":
          description: Bad request - Validation failed
        "500":
          description: Internal server error

  /api/user/v1/submit-otp:
    post:
      summary: loginOTP for user login
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sentCode:
                  type: string
                  example: "123456"
                  description: OTP sent to the user
                mobile:
                  type: string
                  example: "9121111111"
                  description: Mobile number of the user
      responses:
        "200":
          description: OTP validated successfully
        "400":
          description: Invalid OTP or request
        "500":
          description: Internal server error

  /api/ticket/v1/add-ticket-user:
    post:
      tags:
        - Ticket
      summary: Create a ticket as a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: The subject of the ticket
                  example: Technical issue
                description:
                  type: string
                  description: The description of the ticket
                  example: My account is not working.
      responses:
        200:
          description: Ticket created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/ticket/v1/get-my-ticket-list-user:
    get:
      tags:
        - Ticket
      summary: Get the list of tickets for a user
      responses:
        200:
          description: List of tickets for the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"

  /api/ticket/v1/get-ticket-messages-user/{id}:
    get:
      tags:
        - Ticket
      summary: Get messages for a specific ticket for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the ticket
      responses:
        200:
          description: Messages for the ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"

  /api/ticket/v1/get-my-ticket-list-admin:
    get:
      tags:
        - Ticket
      summary: Get the list of tickets for an admin
      description: Retrieve tickets created by the authenticated admin. Supports pagination.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            example: 40
          description: "Number of tickets per page (default: 40)"
        - name: page
          in: query
          schema:
            type: integer
            example: 1
          description: "The page number for paginated results (default: 1)"
        - name: pagination
          in: query
          schema:
            type: boolean
            example: true
          description: "Enable or disable pagination (default: true)"
        - name: search
          in: query
          schema:
            type: string
            example: ariakia
          description: search for search
      responses:
        "200":
          description: List of tickets for the admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Tickets retrieved successfully"
                  data:
                    $ref: "#/components/schemas/TicketListResponse"
        "401":
          description: Unauthorized - Admin authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Unauthorized - Admin authentication required"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "An error occurred while retrieving tickets"

  /api/ticket/v1/get-ticket-messages-admin/{id}:
    get:
      tags:
        - Ticket
      summary: Get messages for a specific ticket for an admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the ticket
      responses:
        200:
          description: Messages for the ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
  /api/ticket/v1/user-answer-ticket:
    put:
      tags:
        - Ticket
      summary: Add a user's answer to a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket_id:
                  type: string
                  description: The ID of the ticket
                  example: 63fcb10e80f6fc001c39e3a3
                description:
                  type: string
                  description: The user's message
                  example: I need more details about this.
      responses:
        200:
          description: User's answer added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/ticket/v1/admin-answer-ticket:
    put:
      tags:
        - Ticket
      summary: Add an admin's answer to a ticket
      description: Admin can respond to a ticket and optionally close it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ticket_id
                - description
              properties:
                ticket_id:
                  type: string
                  description: The ID of the ticket
                  example: "63fcb10e80f6fc001c39e3a3"
                description:
                  type: string
                  description: The admin's response message
                  example: "Please follow the provided instructions."
      responses:
        "200":
          description: Admin's answer added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Ticket answered successfully"
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
                        example: "63fcb10e80f6fc001c39e3a3"
                      description:
                        type: string
                        example: "Please follow the provided instructions."
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Ticket not found"
        "400":
          description: Bad request (missing required fields)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Missing ticket_id or description"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "An error occurred while updating the ticket"

  /api/ticket/v1/admin--ticket-list-delete:
    delete:
      tags:
        - Ticket
      summary: Soft delete multiple tickets by admin
      description: Admin can mark multiple tickets as deleted by providing their IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tickets
              properties:
                tickets:
                  type: array
                  description: List of ticket IDs to be marked as deleted
                  items:
                    type: string
                    example: "63fcb10e80f6fc001c39e3a3"
      responses:
        "200":
          description: Tickets successfully marked as deleted
